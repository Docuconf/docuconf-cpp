name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly against docuconf-go main; push and pull_request use .github/docuconf-go.ref.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty means .github/docuconf-go.ref)
        required: false
        default: ""

permissions:
  contents: read

env:
  CUE_VERSION: v0.17.1

jobs:
  test:
    name: build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$OVERRIDE" ]; then echo "ref=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang libcli11-dev nlohmann-json3-dev libre2-dev \
            libssl-dev libyaml-cpp-dev libtomlplusplus-dev libgtest-dev python3
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@${CUE_VERSION}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test (including conformance, the README blocks and the compile-fail checks)
        env:
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          CUE: /home/runner/go/bin/cue
        run: ctest --test-dir build --output-on-failure
      - name: Run scripts/conformance.sh
        env:
          # Reuses the build above.
          DOCUCONF_BUILD_DIR: build
          CUE: /home/runner/go/bin/cue
        run: DOCUCONF_GO_DIR="$GITHUB_WORKSPACE/docuconf-go" scripts/conformance.sh
      - name: cue vet the golden export and the example contract
        run: |
          for f in tests/golden/gateway.cue examples/orders/contract.cue; do
            dir="$(mktemp -d)"
            cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$dir/"
            mkdir "$dir/svc" && cp "$f" "$dir/svc/contract.cue"
            (cd "$dir" && ~/go/bin/cue vet -c ./svc) || { echo "::error file=$f::cue vet failed"; exit 1; }
            echo "$f: ok"
          done

  bare-machine:
    # A machine with only a compiler, CMake and git: every dependency docuconf
    # needs is fetched. The environment-only build needs nothing else; file
    # inputs add OpenSSL.
    name: bare machine (${{ matrix.mode }})
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: env-only
            packages: ""
            flags: --env-only
          - mode: file-inputs
            packages: libssl-dev
            flags: ""
    steps:
      - name: Install a compiler, CMake and git only
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ cmake ninja-build git ca-certificates python3 \
            ${{ matrix.packages }}
      - uses: actions/checkout@v4
      - name: Build the README quickstart as a new project
        run: tests/readme_consumer.sh "$RUNNER_TEMP/consumer" ${{ matrix.flags }} -G Ninja

  env-only:
    name: environment-only build and tests
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install a compiler, CMake and git only
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ cmake ninja-build git ca-certificates python3
      - uses: actions/checkout@v4
      - name: Check out docuconf-go (conformance cases)
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: main
          path: docuconf-go
      - name: Configure, build and test
        env:
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
        run: |
          cmake -S . -B build -G Ninja -DDOCUCONF_FILE_INPUTS=OFF -DDOCUCONF_BUILD_EXAMPLES=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

  example:
    name: orders example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$OVERRIDE" ]; then echo "ref=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libcli11-dev nlohmann-json3-dev libre2-dev \
            libssl-dev libyaml-cpp-dev libtomlplusplus-dev curl
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@${CUE_VERSION}
      - name: Build the example against the SDK in this repository
        run: |
          cmake -S examples/orders -B build-orders -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-orders --target orders
      # metadata.generator.version is ignored: release PRs bump it.
      - name: Re-export the contract and compare
        run: |
          ./build-orders/orders --docuconf-export /tmp/contract.cue
          scripts/check-generated.sh --files examples/orders/contract.cue /tmp/contract.cue
      - name: cue vet the contract
        run: |
          dir="$(mktemp -d)"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$dir/"
          mkdir "$dir/svc" && cp examples/orders/contract.cue "$dir/svc/contract.cue"
          cd "$dir" && ~/go/bin/cue vet -c ./svc
      - name: Install the docuconf CLI
        working-directory: docuconf-go/cmd/docuconf
        run: go install .
      # CONFIG.md, CONFIG.agents.md and docs.json are generated from the
      # committed contract.cue (the re-export above writes to /tmp, so a
      # release's metadata.generator.version bump stays in all four files).
      - name: Generated docs are up to date
        working-directory: examples/orders
        run: |
          git checkout -- contract.cue
          ~/go/bin/docuconf docs contract.cue --check CONFIG.md
          ~/go/bin/docuconf docs contract.cue --format agents --check CONFIG.agents.md
          ~/go/bin/docuconf docs contract.cue --format model --check docs.json
      - name: Smoke test
        run: examples/orders/smoke.sh build-orders/orders
