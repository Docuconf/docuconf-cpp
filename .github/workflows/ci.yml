name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly against docuconf-go main; push and pull_request use .github/docuconf-go.ref.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty means .github/docuconf-go.ref)
        required: false
        default: ""

permissions:
  contents: read

env:
  CUE_VERSION: v0.17.1

jobs:
  test:
    name: build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$OVERRIDE" ]; then echo "ref=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go (meta-schema and conformance cases)
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang libcli11-dev nlohmann-json3-dev libre2-dev \
            libssl-dev libyaml-cpp-dev libtomlplusplus-dev libgtest-dev
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@${CUE_VERSION}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test (including conformance)
        env:
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          CUE: /home/runner/go/bin/cue
        run: ctest --test-dir build --output-on-failure
      - name: Conformance (scripts/conformance.sh)
        env:
          # Reuses the build above.
          DOCUCONF_BUILD_DIR: build
          CUE: /home/runner/go/bin/cue
        run: DOCUCONF_GO_DIR="$GITHUB_WORKSPACE/docuconf-go" scripts/conformance.sh
      - name: cue vet the golden export and the example contract
        run: |
          for f in tests/golden/gateway.cue examples/orders/contract.cue; do
            dir="$(mktemp -d)"
            cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$dir/"
            mkdir "$dir/svc" && cp "$f" "$dir/svc/contract.cue"
            (cd "$dir" && ~/go/bin/cue vet -c ./svc) || { echo "::error file=$f::cue vet failed"; exit 1; }
            echo "$f: ok"
          done

  example:
    name: orders example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$OVERRIDE" ]; then echo "ref=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go (meta-schema)
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libcli11-dev nlohmann-json3-dev libre2-dev \
            libssl-dev libyaml-cpp-dev libtomlplusplus-dev curl
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@${CUE_VERSION}
      - name: Build the example against the SDK in this repository
        run: |
          cmake -S examples/orders -B build-orders -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-orders --target orders
      - name: Re-export the contract and compare
        run: |
          ./build-orders/orders --docuconf-export /tmp/contract.cue
          diff -u examples/orders/contract.cue /tmp/contract.cue
      - name: cue vet the contract
        run: |
          dir="$(mktemp -d)"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$dir/"
          mkdir "$dir/svc" && cp examples/orders/contract.cue "$dir/svc/contract.cue"
          cd "$dir" && ~/go/bin/cue vet -c ./svc
      - name: Smoke test
        run: examples/orders/smoke.sh build-orders/orders
